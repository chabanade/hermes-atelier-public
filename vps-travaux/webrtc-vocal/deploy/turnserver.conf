# /etc/turnserver.conf — relais TURN (coturn) pour le serveur WebRTC vocal.
#
# ┌── POURQUOI ────────────────────────────────────────────────────────────────┐
# │ STUN (déjà en place) suffit dans ~90 % des cas : il fait découvrir au       │
# │ navigateur son adresse PUBLIQUE (candidat « srflx ») et la paire VPS↔client │
# │ devient routable. Mais derrière un NAT SYMÉTRIQUE / CGNAT strict (certaines │
# │ 4G, Wi-Fi d'entreprise, hôtels) même le srflx échoue : il faut RELAYER le   │
# │ média par un serveur TURN — le seul qui marche à 100 %, car tout le trafic  │
# │ audio transite par LUI (candidat « relay »). cf. DIAGNOSTIC.md §2 et TURN.md│
# └────────────────────────────────────────────────────────────────────────────┘
#
# ── OPTION A (ce fichier) ────────────────────────────────────────────────────
#   • TURN over TLS, en TCP, sur le port 5349 UNIQUEMENT.
#   • Le web reste PROPRE sur 443 (Caddy) : aucun port partagé, aucune collision.
#   • Le 5349/TLS ressemble à du HTTPS → traverse les pare-feu sortants stricts
#     qui ne laissent passer « que du 443/web » (c'est tout l'intérêt vs 3478).
#   • Le 3478 clair (UDP/TCP) et le DTLS sont DÉSACTIVÉS (no-udp/no-tcp/no-dtls).
#   • Authentification V1 STATIQUE : un seul compte long-terme (lt-cred-mech +
#     user=) — pas de secret REST tournant. Simple, suffisant pour un seul usage.
#   • ZÉRO code applicatif touché : le serveur (server.py) lit déjà un relais via
#     WEBRTC_TURN_URL/_USER/_PASS, renseignés par deploy/turn.env (cf. restart.sh).
#
# Le certificat TLS est le MÊME que celui de Caddy (Let's Encrypt, valide) ;
# coturn n'a pas le droit de lire le store de Caddy, donc deploy/coturn-cert-sync.sh
# en recopie une instance dans /etc/coturn/certs/ et la resynchronise à chaque
# renouvellement (unit systemd .path). NE PAS éditer les chemins cert/pkey sans
# mettre à jour ce script.
#
# Déploiement : sudo bash deploy/install-coturn.sh  (n'éditez pas ce fichier à la
# main pour le mot de passe : l'installeur génère un secret et l'injecte ici ET
# dans deploy/turn.env, gardés synchrones).

# ── Réseau ───────────────────────────────────────────────────────────────────
# Port TLS (turns:) — le SEUL ouvert au public pour TURN (Option A).
tls-listening-port=5349

# Plages de ports UDP que coturn alloue pour RELAYER le média vers le pair distant
# (ici le serveur aiortc, joint sur l'IP publique du VPS). À ouvrir dans le
# pare-feu en UDP. 40 ports = large pour une poignée de sessions simultanées.
min-port=49160
max-port=49200

# IP publique annoncée dans les candidats « relay ». Sur ce VPS Hostinger l'IP
# publique est portée directement par l'interface ; la déclarer explicitement
# évite toute ambiguïté (et serait OBLIGATOIRE si le VPS était derrière un NAT 1:1).
external-ip=VOTRE_IP_VPS

# ── Authentification (V1 statique) ───────────────────────────────────────────
# Mécanisme « long-term credentials » : le navigateur s'authentifie avec un
# couple user/mot de passe fixe. realm = domaine (obligatoire avec lt-cred-mech).
lt-cred-mech
realm=votre-domaine.example
# Compte unique. Le mot de passe « CHANGE_ME_TURN_PASSWORD » est un PLACEHOLDER :
# install-coturn.sh le remplace par un secret aléatoire et écrit le même secret
# dans deploy/turn.env. Si vous le changez à la main, mettez turn.env à jour aussi.
user=webrtc:CHANGE_ME_TURN_PASSWORD

# ── TLS ──────────────────────────────────────────────────────────────────────
# Copies maintenues par deploy/coturn-cert-sync.sh (cert Let's Encrypt de Caddy).
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/key.pem
# Plancher TLS 1.2 : on refuse les vieux protocoles.
no-tlsv1
no-tlsv1_1

# ── Durcissement ─────────────────────────────────────────────────────────────
# Option A = TCP/TLS only : on coupe tout le reste de la surface.
no-dtls
no-tcp
no-udp
no-cli
fingerprint
stale-nonce=600

# Anti-abus « open relay » : interdire à un client TURN de se faire relayer vers
# des réseaux internes/privés (le pair légitime — aiortc — est sur l'IP PUBLIQUE
# du VPS, donc jamais bloqué par ces règles). Sans ça, un tiers pourrait utiliser
# ce TURN pour atteindre des services internes (SSRF via relais).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas modestes (un seul usage perso) : plafonne sessions et débit pour limiter
# l'impact d'un éventuel abus de credential. Décommentez/ajustez au besoin.
#total-quota=50
#user-quota=12
#bps-capacity=0

# Journalisation vers journald (journalctl -u coturn). « verbose » pour débugger.
syslog
#verbose
